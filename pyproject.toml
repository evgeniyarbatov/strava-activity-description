[project]
name = "run-reflection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "crewai",
    "defusedxml>=0.7.1",
    "geopy",
    "google-genai",
    "litellm",
    "numpy",
    "polyline",
    "pyproj",
    "python-dotenv",
    "pyyaml",
    "shapely",
]

[dependency-groups]
dev = [
    "boto3-stubs[dynamodb]>=1.43.47",
    "mypy>=2.3.0",
    "pytest",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260518",
    "types-shapely>=2.1.0.20260630",
]

[tool.uv]
package = false


[tool.ruff]
line-length = 99
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RET", "S"]
ignore = ["E501", "B008", "S101", "S311"]


[tool.ruff.format]
quote-style = "double"


[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "geopy.*"
ignore_missing_imports = true
